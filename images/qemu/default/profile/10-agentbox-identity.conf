[Unit]
Requires=cloud-init-local.service cloud-init-network.service
After=cloud-init-local.service cloud-init-network.service systemd-user-sessions.service

[Service]
ExecStartPre=/usr/bin/test -s /etc/ssh/agentbox_authorized_keys
ExecStartPre=/usr/bin/test -s /etc/ssh/ssh_host_ed25519_key
ExecStartPre=/usr/bin/test -s /etc/ssh/ssh_host_ed25519_key.pub
